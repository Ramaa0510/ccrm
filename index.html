<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contactos</title>
    <style>
      :root {
        --bg: #f5f5f2;
        --panel: #ffffff;
        --ink: #201f1d;
        --ink-soft: #706a63;
        --ink-faint: #a39c93;
        --border: #e2ded6;
        --accent: #8a5a3b;
        --danger: #a9432a;
        --warn: #b5842b;
        --warn-bg: #f7eedd;
        --font:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial,
          sans-serif;
        --font-head: Georgia, "Iowan Old Style", "Palatino Linotype", serif;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: var(--font);
      }
      ::selection {
        background: #efe2d6;
      }

      header {
        padding: 32px 24px 20px;
        max-width: 1100px;
        margin: 0 auto;
      }
      header h1 {
        font-family: var(--font-head);
        font-style: italic;
        font-weight: 400;
        font-size: 26px;
        margin: 0 0 2px;
      }
      header .count {
        font-size: 13px;
        color: var(--ink-soft);
      }

      .toolbar {
        max-width: 1100px;
        margin: 0 auto;
        padding: 0 24px 18px;
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        align-items: center;
      }
      .toolbar input[type="text"] {
        flex: 1;
        min-width: 160px;
        padding: 9px 12px;
        border: 1px solid var(--border);
        border-radius: 5px;
        font-size: 14px;
        background: var(--panel);
        color: var(--ink);
      }
      .toolbar input[type="text"]:focus {
        outline: 2px solid var(--accent);
        outline-offset: 1px;
      }

      .filter-group {
        display: flex;
        gap: 2px;
        background: var(--border);
        border-radius: 6px;
        padding: 2px;
      }
      .filter-group button {
        background: transparent;
        border: none;
        padding: 7px 14px;
        font-size: 13px;
        color: var(--ink-soft);
        border-radius: 5px;
      }
      .filter-group button.active {
        background: var(--panel);
        color: var(--ink);
        font-weight: 600;
      }

      button {
        font-family: var(--font);
        cursor: pointer;
      }
      .btn-primary {
        background: var(--ink);
        color: #fff;
        border: none;
        padding: 9px 16px;
        border-radius: 5px;
        font-size: 14px;
        font-weight: 600;
        white-space: nowrap;
      }
      .btn-primary:hover {
        background: #3a3733;
      }
      .btn-ghost {
        background: transparent;
        border: 1px solid var(--border);
        padding: 8px 13px;
        border-radius: 5px;
        font-size: 13px;
        color: var(--ink-soft);
      }
      .btn-ghost:hover {
        border-color: var(--ink-faint);
        color: var(--ink);
      }

      .board {
        max-width: 1100px;
        margin: 0 auto;
        padding: 0 24px 60px;
        display: grid;
        gap: 20px;
      }
      .board.split {
        grid-template-columns: 1fr 1fr;
      }
      .board.single {
        grid-template-columns: 1fr;
      }

      .column-head {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        border-bottom: 2px solid var(--border);
        padding-bottom: 8px;
        margin-bottom: 14px;
      }
      .column-head .name {
        font-family: var(--font-head);
        font-style: italic;
        font-size: 18px;
      }
      .column-head .n {
        font-size: 12.5px;
        color: var(--ink-soft);
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
        gap: 12px;
        align-items: start;
      }
      .grid .empty {
        grid-column: 1 / -1;
      }

      .item {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 16px 18px;
        cursor: pointer;
      }
      .item:hover {
        border-color: var(--ink-faint);
      }
      .item .row1 {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 10px;
      }
      .item .company {
        font-size: 16px;
        font-weight: 600;
      }
      .item .niche {
        font-size: 12px;
        color: var(--accent);
        background: #f1e7dd;
        padding: 2px 8px;
        border-radius: 3px;
        white-space: nowrap;
      }
      .item .contact-line {
        font-size: 13px;
        color: var(--ink-soft);
        margin-top: 6px;
      }
      .item .desc {
        font-size: 13.5px;
        color: var(--ink-soft);
        margin-top: 8px;
        line-height: 1.4;
      }

      .empty {
        text-align: center;
        padding: 40px 20px;
        color: var(--ink-soft);
        font-size: 14px;
        line-height: 1.6;
      }
      .empty button {
        margin-top: 14px;
      }

      /* Overlay + modal */
      .overlay {
        position: fixed;
        inset: 0;
        background: rgba(20, 18, 16, 0.35);
        display: none;
        z-index: 40;
      }
      .overlay.show {
        display: block;
      }

      .modal {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: var(--panel);
        border-radius: 8px;
        width: 440px;
        max-width: 92vw;
        max-height: 88vh;
        overflow-y: auto;
        padding: 26px;
        z-index: 50;
        display: none;
      }
      .modal.show {
        display: block;
      }

      .modal-head {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        margin-bottom: 18px;
      }
      .modal-title {
        font-family: var(--font-head);
        font-style: italic;
        font-size: 20px;
        margin: 0;
      }
      .close-x {
        background: none;
        border: none;
        font-size: 20px;
        color: var(--ink-soft);
        line-height: 1;
        padding: 2px 4px;
      }
      .close-x:hover {
        color: var(--ink);
      }

      .field {
        margin-bottom: 14px;
      }
      .field label {
        display: block;
        font-size: 12px;
        color: var(--ink-soft);
        margin-bottom: 4px;
      }
      .field input,
      .field textarea,
      .field select {
        width: 100%;
        padding: 8px 10px;
        border: 1px solid var(--border);
        border-radius: 5px;
        font-size: 14px;
        font-family: var(--font);
        color: var(--ink);
        background: var(--bg);
      }
      .field textarea {
        resize: vertical;
        min-height: 70px;
      }
      .field input:focus,
      .field textarea:focus,
      .field select:focus {
        outline: 2px solid var(--accent);
        outline-offset: 0;
        background: var(--panel);
      }
      .field-row {
        display: flex;
        gap: 10px;
      }
      .field-row .field {
        flex: 1;
      }

      .socio-toggle {
        display: flex;
        gap: 8px;
      }
      .socio-toggle label {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        padding: 8px 10px;
        border: 1px solid var(--border);
        border-radius: 5px;
        font-size: 13.5px;
        cursor: pointer;
        color: var(--ink-soft);
      }
      .socio-toggle input {
        width: auto;
        accent-color: var(--ink);
      }
      .socio-toggle input:checked + span {
        color: var(--ink);
        font-weight: 600;
      }

      .dup-warning {
        display: none;
        background: var(--warn-bg);
        color: var(--warn);
        font-size: 12.5px;
        padding: 8px 10px;
        border-radius: 5px;
        margin-top: -6px;
        margin-bottom: 14px;
        line-height: 1.4;
      }
      .dup-warning.show {
        display: block;
      }

      .modal-actions {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 8px;
      }
      .modal-actions .left {
        display: flex;
        gap: 10px;
      }
      .danger-link {
        background: none;
        border: none;
        color: var(--danger);
        font-size: 13px;
        padding: 0;
      }
      .danger-link:hover {
        text-decoration: underline;
      }

      .confirm-overlay {
        z-index: 70;
      }
      .confirm-box {
        z-index: 80;
        width: 340px;
      }
      .confirm-box .msg {
        font-size: 14px;
        line-height: 1.5;
        margin-bottom: 18px;
      }

      .toast {
        position: fixed;
        bottom: 22px;
        left: 50%;
        transform: translateX(-50%);
        background: var(--ink);
        color: #fff;
        padding: 9px 18px;
        border-radius: 5px;
        font-size: 13px;
        z-index: 60;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.25s;
      }
      .toast.show {
        opacity: 1;
      }

      @media (max-width: 760px) {
        .board.split {
          grid-template-columns: 1fr;
        }
      }
      @media (max-width: 480px) {
        header,
        .toolbar,
        .board {
          padding-left: 16px;
          padding-right: 16px;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Contactos</h1>
      <div class="count" id="count">—</div>
    </header>

    <div class="toolbar">
      <input
        type="text"
        id="search"
        placeholder="Buscar por empresa o nicho…"
      />
      <div class="filter-group" id="filter-group">
        <button data-view="split" class="active">Todos</button>
        <button data-view="rama">Rama</button>
        <button data-view="santi">Santi</button>
      </div>
      <button class="btn-primary" id="btn-add">Agregar</button>
    </div>

    <div class="board split" id="board"></div>

    <div class="overlay" id="overlay"></div>
    <div class="modal" id="modal">
      <div class="modal-head">
        <div class="modal-title" id="modal-title">Nueva empresa</div>
        <button class="close-x" id="modal-close">×</button>
      </div>

      <div class="field">
        <label>Agregado por</label>
        <div class="socio-toggle">
          <label
            ><input type="radio" name="f-socio" value="Rama" /><span
              >Rama</span
            ></label
          >
          <label
            ><input type="radio" name="f-socio" value="Santi" /><span
              >Santi</span
            ></label
          >
        </div>
      </div>

      <div class="field">
        <label>Nombre de la empresa</label>
        <input type="text" id="f-company" placeholder="Ej: Panadería del Sol" />
      </div>
      <div class="dup-warning" id="dup-warning"></div>

      <div class="field">
        <label>Nicho</label>
        <input
          type="text"
          id="f-niche"
          placeholder="Ej: gastronomía, retail, salud…"
        />
      </div>
      <div class="field-row">
        <div class="field">
          <label>Teléfono</label>
          <input type="text" id="f-phone" placeholder="+54 …" />
        </div>
        <div class="field">
          <label>Mail</label>
          <input type="email" id="f-email" placeholder="correo@empresa.com" />
        </div>
      </div>
      <div class="field">
        <label>Descripción</label>
        <textarea
          id="f-desc"
          placeholder="Notas, contexto, qué necesita…"
        ></textarea>
      </div>

      <div class="modal-actions">
        <div class="left">
          <button class="btn-primary" id="save-item">Guardar</button>
          <button class="btn-ghost" id="cancel-item">Cancelar</button>
        </div>
        <button class="danger-link" id="delete-item" style="display: none">
          Eliminar
        </button>
      </div>
    </div>

    <div class="overlay confirm-overlay" id="confirm-overlay"></div>
    <div class="modal confirm-box" id="confirm-box">
      <div class="msg" id="confirm-message"></div>
      <div class="modal-actions">
        <div class="left">
          <button class="btn-primary" id="confirm-yes">Confirmar</button>
          <button class="btn-ghost" id="confirm-no">Cancelar</button>
        </div>
      </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
      (function () {
        const STORAGE_KEY = "crm-simple:empresas";
        const SOCIOS = ["Rama", "Santi"];
        let empresas = [];
        let searchQuery = "";
        let editingId = null;
        let currentView = "split"; // split | rama | santi

        const $ = (sel) => document.querySelector(sel);

        function escapeHTML(str) {
          const d = document.createElement("div");
          d.textContent = str == null ? "" : String(str);
          return d.innerHTML;
        }

        function showToast(msg) {
          const t = $("#toast");
          t.textContent = msg;
          t.classList.add("show");
          setTimeout(() => t.classList.remove("show"), 1500);
        }

        function normalize(str) {
          return (str || "")
            .toLowerCase()
            .normalize("NFD")
            .replace(/[\u0300-\u036f]/g, "")
            .replace(/\s+/g, " ")
            .trim();
        }

        async function load() {
          try {
            const raw = localStorage.getItem(STORAGE_KEY);
            empresas = raw ? JSON.parse(raw) : [];
          } catch (e) {
            empresas = [];
          }
        }

        async function save() {
          try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(empresas));
          } catch (e) {
            showToast("No se pudo guardar. Intentá de nuevo.");
          }
        }

        function matchesSearch(e) {
          if (!searchQuery) return true;
          const q = searchQuery.toLowerCase();
          return (
            (e.company || "").toLowerCase().includes(q) ||
            (e.niche || "").toLowerCase().includes(q)
          );
        }

        function showConfirm(message) {
          return new Promise((resolve) => {
            $("#confirm-message").textContent = message;
            $("#confirm-overlay").classList.add("show");
            $("#confirm-box").classList.add("show");

            const yesBtn = $("#confirm-yes");
            const noBtn = $("#confirm-no");
            const ovl = $("#confirm-overlay");

            function cleanup(result) {
              $("#confirm-overlay").classList.remove("show");
              $("#confirm-box").classList.remove("show");
              yesBtn.removeEventListener("click", onYes);
              noBtn.removeEventListener("click", onNo);
              ovl.removeEventListener("click", onNo);
              resolve(result);
            }
            function onYes() {
              cleanup(true);
            }
            function onNo() {
              cleanup(false);
            }

            yesBtn.addEventListener("click", onYes);
            noBtn.addEventListener("click", onNo);
            ovl.addEventListener("click", onNo);
          });
        }

        function findDuplicate(companyName, excludeId) {
          const norm = normalize(companyName);
          if (!norm) return null;
          return (
            empresas.find(
              (e) => e.id !== excludeId && normalize(e.company) === norm,
            ) || null
          );
        }

        function itemHTML(e) {
          const contactParts = [];
          if (e.phone) contactParts.push(escapeHTML(e.phone));
          if (e.email) contactParts.push(escapeHTML(e.email));
          return `
      <div class="item" data-id="${e.id}">
        <div class="row1">
          <div class="company">${escapeHTML(e.company || "Sin nombre")}</div>
          ${e.niche ? `<div class="niche">${escapeHTML(e.niche)}</div>` : ""}
        </div>
        ${contactParts.length ? `<div class="contact-line">${contactParts.join(" · ")}</div>` : ""}
        ${e.desc ? `<div class="desc">${escapeHTML(e.desc)}</div>` : ""}
      </div>
    `;
        }

        function columnHTML(socio, list) {
          let body;
          if (list.length === 0) {
            body = `<div class="empty">Sin empresas de ${socio} todavía.</div>`;
          } else {
            body = `<div class="grid">${list.map(itemHTML).join("")}</div>`;
          }
          return `
      <div class="column">
        <div class="column-head">
          <span class="name">${socio}</span>
          <span class="n">${list.length}</span>
        </div>
        ${body}
      </div>
    `;
        }

        function render() {
          $("#count").textContent =
            empresas.length === 1 ? "1 empresa" : `${empresas.length} empresas`;

          document.querySelectorAll("#filter-group button").forEach((b) => {
            b.classList.toggle("active", b.dataset.view === currentView);
          });

          const board = $("#board");

          if (empresas.length === 0) {
            board.className = "board single";
            board.innerHTML = `<div class="empty">Todavía no cargaste ninguna empresa.<br><button class="btn-primary" id="empty-add">Agregar la primera</button></div>`;
            return;
          }

          const filtered = empresas.filter(matchesSearch);

          if (currentView === "split") {
            board.className = "board split";
            const rama = filtered.filter((e) => e.socio === "Rama");
            const santi = filtered.filter((e) => e.socio === "Santi");
            board.innerHTML =
              columnHTML("Rama", rama) + columnHTML("Santi", santi);
          } else {
            board.className = "board single";
            const socioLabel = currentView === "rama" ? "Rama" : "Santi";
            const list = filtered.filter((e) => e.socio === socioLabel);
            board.innerHTML = columnHTML(socioLabel, list);
          }
        }

        function openModal(id) {
          editingId = id || null;
          const e = id ? empresas.find((x) => x.id === id) : null;
          $("#modal-title").textContent = e
            ? "Editar empresa"
            : "Nueva empresa";
          $("#f-company").value = e ? e.company : "";
          $("#f-niche").value = e ? e.niche : "";
          $("#f-phone").value = e ? e.phone : "";
          $("#f-email").value = e ? e.email : "";
          $("#f-desc").value = e ? e.desc : "";
          document.querySelectorAll("input[name=f-socio]").forEach((r) => {
            r.checked = e
              ? r.value === e.socio
              : r.value === (currentView === "santi" ? "Santi" : "Rama");
          });
          $("#delete-item").style.display = e ? "inline-block" : "none";
          $("#dup-warning").classList.remove("show");
          $("#overlay").classList.add("show");
          $("#modal").classList.add("show");
          $("#f-company").focus();
        }

        function closeModal() {
          $("#overlay").classList.remove("show");
          $("#modal").classList.remove("show");
          editingId = null;
        }

        function checkDupWhileTyping() {
          const dup = findDuplicate($("#f-company").value, editingId);
          const box = $("#dup-warning");
          if (dup) {
            box.textContent = `Ya hay una empresa cargada con este nombre (agregada por ${dup.socio}${dup.niche ? ", nicho: " + dup.niche : ""}). Revisá antes de guardar de nuevo.`;
            box.classList.add("show");
          } else {
            box.classList.remove("show");
          }
        }

        async function saveItem() {
          const company = $("#f-company").value.trim();
          if (!company) {
            $("#f-company").focus();
            return;
          }

          const socioInput = document.querySelector(
            "input[name=f-socio]:checked",
          );
          const socio = socioInput ? socioInput.value : "Rama";

          const dup = findDuplicate(company, editingId);
          if (dup) {
            const seguir = await showConfirm(
              `Esta empresa ya está cargada (agregada por ${dup.socio}). ¿Querés guardarla de todas formas?`,
            );
            if (!seguir) return;
          }

          const data = {
            company,
            socio,
            niche: $("#f-niche").value.trim(),
            phone: $("#f-phone").value.trim(),
            email: $("#f-email").value.trim(),
            desc: $("#f-desc").value.trim(),
          };
          if (editingId) {
            const e = empresas.find((x) => x.id === editingId);
            Object.assign(e, data);
          } else {
            data.id = crypto.randomUUID
              ? crypto.randomUUID()
              : String(Date.now() + Math.random());
            empresas.unshift(data);
          }
          await save();
          closeModal();
          render();
          showToast("Guardado");
        }

        async function deleteItem() {
          if (!editingId) return;
          const ok = await showConfirm(
            "¿Eliminar esta empresa? No se puede deshacer.",
          );
          if (!ok) return;
          empresas = empresas.filter((x) => x.id !== editingId);
          await save();
          closeModal();
          render();
          showToast("Eliminado");
        }

        $("#btn-add").addEventListener("click", () => openModal(null));
        $("#modal-close").addEventListener("click", closeModal);
        $("#cancel-item").addEventListener("click", closeModal);
        $("#overlay").addEventListener("click", closeModal);
        $("#save-item").addEventListener("click", saveItem);
        $("#delete-item").addEventListener("click", deleteItem);
        $("#f-company").addEventListener("input", checkDupWhileTyping);

        $("#search").addEventListener("input", (e) => {
          searchQuery = e.target.value;
          render();
        });

        $("#filter-group").addEventListener("click", (e) => {
          const btn = e.target.closest("button[data-view]");
          if (!btn) return;
          currentView = btn.dataset.view;
          render();
        });

        $("#board").addEventListener("click", (e) => {
          const emptyAdd = e.target.closest("#empty-add");
          if (emptyAdd) {
            openModal(null);
            return;
          }
          const item = e.target.closest(".item");
          if (item) {
            openModal(item.dataset.id);
          }
        });

        (async function init() {
          await load();
          render();
        })();
      })();
    </script>
  </body>
</html>
